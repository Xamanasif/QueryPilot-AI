[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot-ai"
version = "0.1.0"
description = "Governed RAG and SQL agent for simulated M&A diligence (Groq, FastAPI, SQLite)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "groq>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["querypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
